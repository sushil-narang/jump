<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Risk profiling journey simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBEFEA;--panel:#FFFFFF;--panel-2:#F5F7F3;--ink:#15242A;--ink-2:#55676B;--line:#D3DBD5;
  --petrol:#1F6F78;--petrol-soft:rgba(31,111,120,.10);--marigold:#E3A23B;
  --good:#3F8A5A;--warn:#C9831A;--bad:#C24C3A;--idle:#AAB6B2;
  --b1:#2E6E8E;--b2:#3E9488;--b3:#86A84E;--b4:#E0A03A;--b5:#CF5B3E;
  --eq:#1F6F78;--debt:#9CC3BB;--gold:#E3A23B;--liq:#CBD5D1;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E181B;--panel:#152328;--panel-2:#1A2B30;--ink:#E5EDEA;--ink-2:#9AAEB0;--line:#2A3E43;
  --petrol:#5DB4BC;--petrol-soft:rgba(93,180,188,.14);--eq:#4FA7B0;--debt:#3F7470;--liq:#3A4B4F;--idle:#4A5C60;}}
:root[data-theme="dark"]{
  --bg:#0E181B;--panel:#152328;--panel-2:#1A2B30;--ink:#E5EDEA;--ink-2:#9AAEB0;--line:#2A3E43;
  --petrol:#5DB4BC;--petrol-soft:rgba(93,180,188,.14);--eq:#4FA7B0;--debt:#3F7470;--liq:#3A4B4F;--idle:#4A5C60;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:-.01em}

.app{display:grid;grid-template-columns:minmax(340px,410px) 1fr;height:100%}
.left{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.left-head{padding:18px 22px 14px;border-bottom:1px solid var(--line)}
.left-body{flex:1;overflow:auto;padding:18px 22px 24px}
.left-foot{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;background:var(--panel)}
.right{overflow:auto;padding:24px 28px 48px;min-width:0}
@media (max-width:900px){
  .app{display:block;height:auto}
  .left{border-right:0;border-bottom:1px solid var(--line)}
  .left-body{overflow:visible}
  .right{overflow:visible;padding:18px 14px 40px}
}

/* left header */
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-size:20px}
.brand small{color:var(--ink-2);font-size:12.5px;white-space:nowrap}
.personas{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.personas span{font-size:12.5px;color:var(--ink-2);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:4px 11px;font-size:13px}
.chip:hover{border-color:var(--petrol)}
.chip.ghost{background:none;color:var(--ink-2)}
.stepper{display:flex;gap:4px;margin-top:14px}
.stepper button{flex:1;height:30px;border:0;border-radius:6px;background:var(--panel-2);font-size:12px;font-weight:600;color:var(--ink-2);position:relative;padding:0}
.stepper button.done{background:var(--petrol-soft);color:var(--petrol)}
.stepper button.on{background:var(--petrol);color:#fff}
.step-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;color:var(--ink-2)}

/* questions */
.step-title{font-size:24px;line-height:1.15}
.step-sub{color:var(--ink-2);margin:6px 0 18px;font-size:14px}
.q{margin-bottom:22px}
.q-head{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.q-code{font-size:11.5px;font-weight:700;color:var(--petrol);background:var(--petrol-soft);border-radius:5px;padding:1px 6px;margin-top:2px}
.q-text{font-weight:600;font-size:14.5px;line-height:1.35}
.q-hint{font-size:12.5px;color:var(--ink-2);margin:-2px 0 8px 0}
.found{display:inline-block;font-size:11.5px;font-weight:600;color:var(--good);margin:-2px 0 8px;}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 12px;font-size:14px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--petrol)}
.opt[aria-pressed="true"]{border-color:var(--petrol);background:var(--petrol-soft);font-weight:600}
.opt .pts{font-size:11.5px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.opt[aria-pressed="true"] .pts{color:var(--petrol)}
.note{font-size:12.5px;color:var(--ink-2);background:var(--panel-2);border-radius:8px;padding:9px 11px;margin:-6px 0 18px}

.btn{border:0;border-radius:9px;padding:10px 16px;font-weight:600;font-size:14px}
.btn.primary{background:var(--petrol);color:#fff;margin-left:auto}
.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{background:none;border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}

/* goal editor */
.goal-ed{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--panel)}
.goal-ed.auto{background:var(--panel-2)}
.goal-ed .row{display:flex;gap:8px;align-items:center}
.goal-ed input[type=text]{flex:1;border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--panel)}
.goal-ed input[type=range]{flex:1;accent-color:var(--petrol)}
.goal-ed .yrs{font-weight:700;min-width:62px;text-align:right;font-size:13.5px}
.goal-ed .lbl{font-size:12px;color:var(--ink-2);min-width:62px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:1}
.seg button{flex:1;border:0;background:none;padding:5px 4px;font-size:12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--petrol);color:#fff}
.x{border:0;background:none;color:var(--ink-2);font-size:18px;line-height:1;padding:2px 6px}
.add-goals{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.auto-tag{font-size:11.5px;color:var(--warn);font-weight:600}
.mt8{margin-top:8px}

/* summary */
.sum-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.sum-row b{font-weight:600}
.sum-row button{border:0;background:none;color:var(--petrol);font-weight:600;font-size:12.5px;padding:0}

/* playground */
.pg-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.pg-head h2{font-size:28px;line-height:1.1}
.pg-head p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.live{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,1fr);gap:18px;margin-bottom:18px}
@media (max-width:1150px){.hero{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.panel h3{font-size:16px;margin-bottom:2px}
.panel .sub{color:var(--ink-2);font-size:13px;margin:0 0 14px}

/* ladder */
.ladder{display:grid;grid-template-columns:132px minmax(0,1fr);gap:10px}
.scale,.plot{position:relative;height:260px}
.scale div{position:absolute;right:0;height:20%;display:flex;align-items:center;font-size:12.5px;color:var(--ink-2);text-align:right;line-height:1.15}
.scale div b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-left:7px;flex:none}
.plot{border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
.stripe{position:absolute;left:0;right:0;height:20%;border-top:1px dashed var(--line)}
.pband{position:absolute;left:4px;right:4px;height:20%;border-radius:8px;border:2px solid var(--pc,var(--idle));background:color-mix(in srgb,var(--pc,var(--idle)) 15%,transparent);transition:bottom .55s cubic-bezier(.2,.8,.2,1),border-color .3s,background .3s,opacity .3s}
.cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr)}
.col{position:relative;margin:0 26%}
.bar{position:absolute;left:0;right:0;bottom:0;border-radius:7px 7px 0 0;transition:height .55s cubic-bezier(.2,.8,.2,1),background .3s}
.excess{position:absolute;left:0;right:0;border-radius:7px 7px 0 0;border:1.5px dashed var(--ec);border-bottom:0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ec) 35%,transparent) 0 3px,transparent 3px 8px);transition:bottom .55s cubic-bezier(.2,.8,.2,1),height .55s cubic-bezier(.2,.8,.2,1),opacity .3s}
.capline{position:absolute;left:-6px;right:-6px;border-top:2px dotted var(--ink-2);transition:bottom .55s}
.col.binding .bar{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--ink)}
.col-labels{display:grid;grid-template-columns:132px repeat(3,minmax(0,1fr));gap:0 10px;margin-top:10px}
.col-labels>div{text-align:center;font-size:12.5px;line-height:1.3;padding:0 4px}
.col-labels>div:first-child{visibility:hidden}
.col-labels strong{display:block;font-size:13.5px}
.col-labels em{font-style:normal;color:var(--ink-2)}
.col-labels .tag{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;background:var(--ink);color:var(--panel);border-radius:5px;padding:1px 6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* dial */
.dial-wrap{display:flex;flex-direction:column;align-items:center;text-align:center}
.dial svg{width:100%;max-width:300px;display:block}
.needle{transition:transform .7s cubic-bezier(.3,1.4,.4,1);transform-origin:150px 150px}
.pname{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1;margin-top:2px}
.pmeta{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0 10px}
.badge{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid var(--line)}
.badge.High{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.badge.Medium{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.badge.Low{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.why{font-size:14px;line-height:1.45;background:var(--panel-2);border-radius:10px;padding:11px 13px;text-align:left;width:100%}

/* lens */
.lens h3{font-size:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{border-radius:12px;padding:14px;border:1.5px solid var(--line);background:var(--panel-2);transition:border-color .3s,background .3s}
.tile .light{width:12px;height:12px;border-radius:50%;background:var(--idle);display:inline-block;margin-right:8px;vertical-align:-1px;transition:background .3s}
.tile.g{border-color:color-mix(in srgb,var(--good) 55%,transparent)} .tile.g .light{background:var(--good)}
.tile.a{border-color:color-mix(in srgb,var(--warn) 60%,transparent)} .tile.a .light{background:var(--warn)}
.tile.r{border-color:color-mix(in srgb,var(--bad) 60%,transparent)} .tile.r .light{background:var(--bad)}
.tile h4{margin:0 0 6px;font-size:14.5px}
.tile p{margin:0;font-size:13px;color:var(--ink-2)}
.tile .cap{margin-top:8px;font-size:12.5px;font-weight:600}
.path{border-radius:12px;padding:14px;border:1.5px dashed var(--line);opacity:.55;transition:all .3s}
.path.on{opacity:1;border-style:solid;border-color:var(--petrol);background:var(--petrol-soft)}
.path h4{margin:0 0 6px;font-size:15px}
.path ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.src-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.src{font-size:11.5px;font-weight:600;border-radius:5px;padding:2px 7px;background:var(--panel-2);color:var(--ink-2)}
.state{font-size:12px;font-weight:600;min-width:90px;text-align:right}
.state.found{color:var(--good)} .state.ask{color:var(--ink-2)}

.contrib{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;padding:7px 0;font-size:13.5px}
.track{height:14px;border-radius:7px;background:var(--panel-2);position:relative;overflow:hidden;border:1px solid var(--line)}
.fill{position:absolute;inset:0 auto 0 0;background:var(--petrol);border-radius:7px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.contrib .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.contrib .v small{color:var(--ink-2);font-weight:400}
.total{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700}

.scenario svg{width:100%;display:block}
.ranges .rg{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;margin:7px 0;font-size:12px}
.rg .rtrack{position:relative;height:18px;background:var(--panel-2);border-radius:5px}
.rg .rbar{position:absolute;top:3px;bottom:3px;border-radius:4px;background:var(--idle);transition:background .3s}
.rg.on .rbar{background:var(--petrol)}
.rg .zero{position:absolute;top:-2px;bottom:-2px;width:1.5px;background:var(--ink-2)}
.rg .rl{position:absolute;top:0;font-size:11px;line-height:18px;color:var(--ink-2);white-space:nowrap}
.consist{margin-top:14px}
.meter{position:relative;height:36px;margin:6px 8px 0}
.meter .line{position:absolute;left:0;right:0;top:16px;height:2px;background:var(--line)}
.meter .dot{position:absolute;top:8px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--petrol);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;transition:left .5s}
.meter .tick{position:absolute;top:28px;font-size:10.5px;color:var(--ink-2);transform:translateX(-50%)}
.bubble{margin-top:12px;background:var(--panel-2);border-left:3px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:13.5px}

.matrix{width:100%;border-collapse:separate;border-spacing:4px;font-size:12.5px}
.matrix th{font-weight:600;color:var(--ink-2);text-align:center;padding:4px}
.matrix th.rowh{text-align:right;white-space:nowrap}
.matrix td{height:46px;border-radius:7px;text-align:center;font-weight:700;position:relative;vertical-align:middle;color:var(--ink)}
.matrix tr.prow td{outline:2px solid var(--ink);outline-offset:-1px}
.matrix tr.prow th{color:var(--ink)}
.gpin{display:block;font-size:10.5px;font-weight:700;background:var(--ink);color:var(--panel);border-radius:4px;padding:0 4px;margin:2px auto 0;max-width:94%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.gcard{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel)}
.gcard h4{margin:0;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.gcard h4 small{font-weight:500;color:var(--ink-2);font-size:12.5px;white-space:nowrap}
.gcard .meta{font-size:12.5px;color:var(--ink-2);margin:2px 0 10px}
.stack{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--panel-2)}
.stack div{transition:width .5s cubic-bezier(.2,.8,.2,1)}
.alloc{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:8px;color:var(--ink-2)}
.alloc i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.alloc b{color:var(--ink)}
.outcomes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.outcomes div{background:var(--panel-2);border-radius:8px;padding:7px 8px;font-size:11.5px;color:var(--ink-2)}
.outcomes b{display:block;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.lever{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.lever .up{font-weight:700;color:var(--good);white-space:nowrap}
.empty{color:var(--ink-2);font-size:14px;padding:16px;border:1.5px dashed var(--line);border-radius:12px;text-align:center}
.foot{font-size:12px;color:var(--ink-2);margin-top:16px;line-height:1.5}
.section-gap{margin-top:18px}
</style>
</head>
<body>
<div class="app">
  <aside class="left" aria-label="Your answers">
    <div class="left-head">
      <div class="brand"><h1>Your answers</h1><small id="timeLeft"></small></div>
      <div class="personas"><span>Try a persona:</span>
        <button class="chip" data-persona="riya">Riya, 26</button>
        <button class="chip" data-persona="arjun">Arjun, 42</button>
        <button class="chip" data-persona="kaur">Mrs. Kaur, 63</button>
        <button class="chip ghost" data-persona="reset">Start fresh</button>
      </div>
      <nav class="stepper" id="stepper" aria-label="Journey steps"></nav>
      <div class="step-meta"><span id="stepName"></span><span id="stepCount"></span></div>
    </div>
    <div class="left-body" id="leftBody"></div>
    <div class="left-foot">
      <button class="btn quiet" id="backBtn">Back</button>
      <button class="btn primary" id="nextBtn">Continue</button>
    </div>
  </aside>
  <main class="right" id="right" aria-live="polite"></main>
</div>

<script>
const BANDS=['Conservative','Moderately Conservative','Moderate','Moderately Aggressive','Aggressive'];
const BCOL=['var(--b1)','var(--b2)','var(--b3)','var(--b4)','var(--b5)'];
const MATRIX=[[10,15,25,30],[10,25,35,45],[15,35,50,60],[20,45,65,75],[20,50,75,90]];
const HCOLS=['Under 3 yrs','3 to 5 yrs','5 to 7 yrs','7+ yrs'];
const FLEX=['Fixed date','Can move','Nice to have'];

const Q={
 S1:{text:'What brings you here?',hint:'Choose all that apply',multi:true,opts:[['Save for a goal'],['Invest a lump sum'],['Check my portfolio']]},
 S2:{text:'Connect your accounts to skip questions?',hint:'Read-only, with consent you can revoke any time',opts:[['Connect via Account Aggregator'],['Upload CAS statement'],['Skip for now']]},
 F1:{text:'If your income stopped today, how many months of expenses could you cover?',opts:[['Less than 1 month',null,2],['1 to 3 months',null,3],['3 to 6 months'],['6 months or more']]},
 F2:{text:'Do you carry costly debt, like rolled-over card dues or a loan above 14%?',opts:[['Yes',null,3],['No']]},
 F3:{text:'Which cover do you have?',opts:[['Health and term life'],['Health only'],['Term life only'],['Neither']]},
 K1:{text:'Years until you plan to stop earning',w:.25,short:'Years of earning left',opts:[['Under 5',0],['5 to 10',1],['10 to 20',2],['20 to 30',3],['30+',4]]},
 K2:{text:'Your main income',w:.20,short:'Income stability',opts:[['No regular income',0],['Variable, freelance or commission',1],['Pension or rental',2],['Salaried or steady business',3],['Two or more stable incomes',4]]},
 K3:{text:'People fully dependent on you',w:.15,short:'Dependents',opts:[['4 or more',0],['3',1],['2',2],['1',3],['None',4]]},
 K4:{text:'Share of monthly income going to EMIs',w:.20,short:'EMI load',opts:[['Over 50%',0],['35 to 50%',1],['20 to 35%',2],['10 to 20%',3],['Under 10% or none',4]]},
 K5:{text:'Savings and investments (excluding home and emergency fund) as a multiple of yearly expenses',w:.20,short:'Savings cushion',opts:[['Under 1×',0],['1 to 3×',1],['3 to 7×',2],['7 to 15×',3],['Over 15×',4]]},
 T1:{text:'Your ₹5,00,000 is worth ₹4,00,000 three months later. What do you do?',w:.35,opts:[['Sell everything',0],['Sell some',1],['Pause new SIPs, hold the rest',2],['Hold and continue',3],['Invest more',4]]},

const pts=(c)=>{const i=S.a[c];return (i===undefined||!Q[c].opts[i])?undefined:Q[c].opts[i][1]};
const band=s=>s==null?null:Math.min(5,Math.floor(Math.round(s)/20)+1);
function compute(a){
  const P=c=>{const i=a[c];return (i===undefined)?undefined:Q[c].opts[i][1]};
  const layer=codes=>{let n=0,d=0,ans=0;codes.forEach(c=>{if(a[c]!==undefined){ans++;const p=P(c);if(p!=null){n+=p/4*Q[c].w;d+=Q[c].w}}});return {score:d?100*n/d:null,ans,all:ans===codes.length}};
  const cap=layer(['K1','K2','K3','K4','K5']);
  const tol=layer(['T1','T2','T3','T4']);
  const hasDep=a.K3!==undefined&&P('K3')<4;
  const fcaps={F1:5,F2:5,F3:5};
  if(a.F1!==undefined)fcaps.F1=Q.F1.opts[a.F1][2]||5;
  if(a.F2!==undefined)fcaps.F2=Q.F2.opts[a.F2][2]||5;
  if(a.F3!==undefined&&(a.F3===1||a.F3===3)&&hasDep)fcaps.F3=4;
  const fAns=['F1','F2','F3'].filter(c=>a[c]!==undefined).length;
  const found=fAns?Math.min(fcaps.F1,fcaps.F2,fcaps.F3):null;
  const capB=band(cap.score), tolRaw=band(tol.score);
  const expUnder=a.E1===undefined||a.E1<=1;
  const guard=tolRaw===5&&a.T3===2&&expUnder;
  const tolB=guard?4:tolRaw;
  const avail=[capB,tolB,found].filter(x=>x!=null);
  const profile=avail.length?Math.min(...avail):null;
  let binding=null;
  if(profile!=null){ if(capB===profile)binding='capacity';else if(tolB===profile)binding='tolerance';else binding='foundation'; }
  const tp=['T1','T2','T3'].map(P).filter(x=>typeof x==='number');
  const spread=tp.length>1?Math.max(...tp)-Math.min(...tp):0;
  const preCount=['K2','K4','K5'].filter(c=>S.pre[c]).length;
  const confidence=spread>=3?'Low':(preCount>=2?'High':'Medium');
  const complete=cap.all&&tol.all&&fAns===3;
  return {cap,tol,capB,tolRaw,tolB,guard,found,fcaps,fAns,profile,binding,spread,confidence,complete,hasDep};
}
function goalAlloc(g,profile){

  if(g.flex===0)col=Math.max(col-1,0);
  const row=g.income?Math.min(profile,3):profile;
  const eq=MATRIX[row-1][col];
  const gold=row<=2?5:8, liq=g.income?15:0;
  return {eq,gold,liq,debt:100-eq-gold-liq,col,row,max:eq};
}

function arc(cx,cy,r,a0,a1){const p=a=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];const [x0,y0]=p(a0),[x1,y1]=p(a1);return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`}
function whyText(r){

  if(r.binding==='capacity')return `You\u2019re comfortable with more ups and downs, but your current commitments mean a big loss would hurt. We\u2019ve kept your plan at ${name}.`;
  if(r.binding==='tolerance')return r.guard?`You haven\u2019t lived through a market fall yet. We\u2019ve set your plan at ${name} and will unlock more growth once you\u2019ve held through one.`:`Your finances could handle more risk, but you told us big drops would worry you. A plan you can stick with beats one you abandon.`;

  const lbl=['You lock in the loss as cash','Part of the recovery is missed','Holding keeps you in the recovery','You ride the full recovery','Buying low adds extra growth'];
  const t2=S.a.T2;
  const R=[[98,110],[95,115],[90,125],[80,135],[70,150]];
  const Xr=v=>((v-62)/(195-62))*100;
  const tp=['T1','T2','T3'].map(c=>[c,pts(c)]).filter(x=>typeof x[1]==='number');
  return `<div class="panel lens"><h3>How a fall would play out for you</h3><p class="sub">Shown in rupees, because \u201c\u201320%\u201d is easy to shrug off and \u20b91,00,000 gone is not. Recovery paths are illustrative.</p>
  <div class="grid2"><div class="scenario"><svg viewBox="0 0 480 220" role="img" aria-label="Scenario: portfolio falls from 5 lakh to 4 lakh">
    <line x1="30" y1="${Y(500000)}" x2="450" y2="${Y(500000)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <text x="34" y="${Y(500000)-6}" font-size="11" fill="var(--ink-2)" font-family="Figtree,sans-serif">Starting value ₹5,00,000</text>
    <path d="M${X(0)} ${Y(500000)} C${X(1)} ${Y(490000)}, ${X(2)} ${Y(410000)}, ${X(3)} ${Y(400000)}" stroke="var(--bad)" stroke-width="3" fill="none"/>
    <circle cx="${X(3)}" cy="${Y(400000)}" r="5" fill="var(--bad)"/>
    <text x="${X(3)+8}" y="${Y(400000)+18}" font-size="12" font-weight="700" fill="var(--bad)" font-family="Figtree,sans-serif">₹4,00,000 after 3 months</text>
    ${path2?`<path d="${path2}" stroke="var(--petrol)" stroke-width="3" fill="none" stroke-dasharray="${t1===0?'0':'7 5'}"/><circle cx="${X(12)}" cy="${Y(end)}" r="5" fill="var(--petrol)"/><text x="${X(12)-4}" y="${Y(end)-10}" text-anchor="end" font-size="12" font-weight="700" fill="var(--petrol)" font-family="Figtree,sans-serif">${inr(end)} at month 12</text>`:`<text x="${X(7)}" y="${Y(470000)}" text-anchor="middle" font-size="12.5" fill="var(--ink-2)" font-family="Figtree,sans-serif">Answer T1 to see what happens next</text>`}
    <text x="30" y="212" font-size="11" fill="var(--ink-2)" font-family="Figtree,sans-serif">Month 0</text><text x="450" y="212" text-anchor="end" font-size="11" fill="var(--ink-2)" font-family="Figtree,sans-serif">Month 12</text></svg>
    <div style="font-size:13.5px;font-weight:600;margin-top:4px">${t1===undefined?'':lbl[t1]}</div></div>
  <div class="ranges"><div style="font-size:13px;font-weight:600;margin-bottom:6px">One-year range for ₹1,00,000 (T2)</div>
    ${R.map((rg,i)=>`<div class="rg ${t2===i?'on':''}"><b>${'ABCDE'[i]}</b><div class="rtrack"><div class="zero" style="left:${Xr(100)}%"></div><div class="rbar" style="left:${Xr(rg[0])}%;width:${Xr(rg[1])-Xr(rg[0])}%"></div><span class="rl" style="left:calc(${Xr(rg[1])}% + 6px)">₹${rg[0]}k to ₹${(rg[1]/100).toFixed(2)}L</span></div></div>`).join('')}
    <div class="consist"><div style="font-size:13px;font-weight:600">Do your answers agree? (T1 to T3)</div>
      <div class="meter"><div class="line"></div>${[0,1,2,3,4].map(v=>`<span class="tick" style="left:${v*25}%">${v}</span>`).join('')}${tp.map(([c,p],j)=>`<div class="dot" style="left:calc(${p*25}% + ${(j-1)*14}px)" title="${c}">${c.slice(1)}</div>`).join('')}</div>
      ${r.spread>=3?`<div class="bubble"><b>AI follow-up:</b> You said you\u2019d ${t1>=3?'hold or buy more':'sell'} in a fall, but your other answers point the other way. What would you really do with your own money?</div>`:(tp.length>1?`<div class="q-hint" style="margin-top:8px">Spread of ${r.spread} point${r.spread===1?'':'s'}: consistent.</div>`:'')}
    </div></div></div></div>`;
}
function goalCards(r){
  const gs=allGoals();
  if(!gs.length)return `<div class="empty">Add a goal on the left to see its mix of equity, debt and gold.</div>`;
  if(r.profile==null)return `<div class="empty">Answer the risk questions first; each goal\u2019s mix depends on your profile.</div>`;
  return `<div class="grid2">${gs.map(g=>{const al=goalAlloc(g,r.profile);const o=outcomes(al);
    return `<div class="gcard"><h4>${g.name}<small>${g.years<1?'Now':g.years+' yrs'}</small></h4>
    <div class="meta">${g.years<1?'Held in liquid funds':`${FLEX[g.flex]}${g.income?', monthly income':''} · equity capped at ${al.max}%`}</div>
    <div class="stack" role="img" aria-label="Equity ${al.eq}%, debt ${al.debt}%, gold ${al.gold}%, liquid ${al.liq}%"><div style="width:${al.eq}%;background:var(--eq)"></div><div style="width:${al.debt}%;background:var(--debt)"></div><div style="width:${al.gold}%;background:var(--gold)"></div><div style="width:${al.liq}%;background:var(--liq)"></div></div>
    <div class="alloc">${al.eq?`<span><i style="background:var(--eq)"></i>Equity <b>${al.eq}%</b></span>`:''}${al.debt?`<span><i style="background:var(--debt)"></i>Debt <b>${al.debt}%</b></span>`:''}${al.gold?`<span><i style="background:var(--gold)"></i>Gold <b>${al.gold}%</b></span>`:''}${al.liq?`<span><i style="background:var(--liq)"></i>Liquid <b>${al.liq}%</b></span>`:''}</div>
    <div class="outcomes"><div>Bad year<b>${inrK(o[0])}</b></div><div>Typical year<b>${inrK(o[1])}</b></div><div>Good year<b>${inrK(o[2])}</b></div></div>
    <div class="q-hint" style="margin:6px 0 0">Per ₹1L invested, after one year</div></div>`}).join('')}</div>`;
}
function lensGoals(r){
  const gs=allGoals().filter(g=>g.years>=1);
  const pins={};
  if(r.profile)gs.forEach(g=>{const al=goalAlloc(g,r.profile);const k=al.row+'-'+al.col;(pins[k]=pins[k]||[]).push(g.name)});
  const heat=v=>`color-mix(in srgb,var(--eq) ${Math.round(v*.9)}%,var(--panel-2))`;
  const ink=v=>v>=55?'#fff':'var(--ink)';
  return `<div class="panel lens"><h3>Horizon caps each goal, whatever your profile</h3><p class="sub">Maximum equity % by profile and how soon you need the money. A fixed-date goal moves one column left for safety; one that pays monthly income uses at most the Moderate row.</p>
  <div style="overflow-x:auto"><table class="matrix"><thead><tr><th></th>${HCOLS.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>
  ${[4,3,2,1,0].map(i=>`<tr class="${r.profile===i+1?'prow':''}"><th class="rowh">${BANDS[i]}</th>${MATRIX[i].map((v,j)=>`<td style="background:${heat(v)};color:${ink(v)}">${v}%${(pins[(i+1)+'-'+j]||[]).map(n=>`<span class="gpin">${n}</span>`).join('')}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div></div>
  <div class="section-gap">${goalCards(r)}</div>`;
}
function lensPlan(r){
  const L=levers(r);
  return `<div class="grid2"><div class="panel"><h3>What would change this</h3><p class="sub">${r.complete?'The smallest moves that lift your profile, tested against your own answers.':'Finish the questions to see what would move your profile.'}</p>
    ${r.complete?(L.length?L.map(l=>`<div class="lever"><span style="flex:1">${l.text}</span><span class="up">→ ${BANDS[l.to-1]}</span></div>`).join(''):`<div class="lever">${r.binding==='tolerance'?'Your comfort with losses sets this plan, and that\u2019s the right anchor. We\u2019ll check in again after 12 months or a big market move.':'Nothing small would change your profile right now.'}</div>`):''}
  </div>
  <div class="panel"><h3>How we got here</h3><p class="sub">The three checks, in numbers.</p>
    <div class="sum-row"><span>Safety net</span><b>${r.found==null?'—':r.found===5?'No cap':'Caps at '+BANDS[r.found-1]}</b></div>
    <div class="sum-row"><span>Capacity</span><b>${r.cap.score==null?'—':Math.round(r.cap.score)+' → '+BANDS[r.capB-1]}</b></div>
    <div class="sum-row"><span>Tolerance</span><b>${r.tol.score==null?'—':Math.round(r.tol.score)+' → '+BANDS[r.tolB-1]+(r.guard?' (capped)':'')}</b></div>
    <div class="sum-row"><span>Profile = the lowest</span><b>${r.profile?BANDS[r.profile-1]:'—'}</b></div>
  </div></div>
  <h3 class="section-gap" style="font-size:18px;margin-bottom:10px">Your goals</h3>${goalCards(r)}
  <p class="foot">Illustrative simulation of the v2 risk profiling logic. Return ranges per ₹1L use assumed yearly returns (equity −25% / 11% / 30%, debt 3% / 7% / 9%, gold −5% / 7% / 15%, liquid 5% to 6.5%) and are not predictions. Investments are subject to market risk.</p>`;
}

function renderRight(){
  const r=compute(S.a);
  const s=STEPS[S.step];
  const head={intent:'Start with why you\u2019re here',connect:'Let your data do the typing',foundation:'First, the safety net',capacity:'What your finances can carry',tolerance:'What you can live with',goals:'One profile, a mix for every goal',plan:r.profile?`Your plan: ${BANDS[r.profile-1]}`:'Your plan'}[s.id];
  const lens={intent:lensIntent,connect:lensConnect,foundation:lensFoundation,capacity:lensCapacity,tolerance:lensTolerance,goals:lensGoals,plan:lensPlan}[s.id](r);
  $('right').innerHTML=`<div class="pg-head"><div><h2>${head}</h2><p>Every answer on the left updates this view instantly.</p></div><span class="live"><i></i>Live</span></div>
  <div class="hero">${ladder(r)}${dial(r)}</div>${lens}`;
}
function render(){renderLeft();renderRight()}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.q){
    const c=t.dataset.q,i=+t.dataset.i;
    if(Q[c].multi){const arr=S.a[c];S.a[c]=arr.includes(i)?arr.filter(x=>x!==i):[...arr,i].sort();syncIntentGoals();}
    else{S.a[c]=i;delete S.pre[c];if(c==='S2')applyConnect(i);}
    render();return;
  }
  if(t.dataset.go!==undefined){S.step=+t.dataset.go;render();$('leftBody').scrollTop=0;return}
  if(t.dataset.persona){loadPersona(t.dataset.persona);return}
  if(t.dataset.add){S.goals.push({id:gid++,name:t.dataset.add,years:+t.dataset.y,flex:1,income:t.dataset.add==='Lump sum'?false:false});render();return}
  if(t.dataset.del){S.goals=S.goals.filter(g=>g.id!=t.dataset.del);render();return}
  if(t.dataset.gflex){S.goals.find(g=>g.id==t.dataset.gflex).flex=+t.dataset.v;render();return}
  if(t.dataset.ginc){S.goals.find(g=>g.id==t.dataset.ginc).income=t.dataset.v==='1';render();return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.gyears){const g=S.goals.find(g=>g.id==t.dataset.gyears);g.years=+t.value;$('yr'+g.id).textContent=g.years+' yrs';renderRight();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.gname){S.goals.find(g=>g.id==t.dataset.gname).name=t.value||'Goal';renderRight();}
});
$('nextBtn').onclick=()=>{if(S.step===6){fresh();render();return}S.step++;if(S.step===5&&!S.goals.length)syncIntentGoals(true);render();$('leftBody').scrollTop=0;$('right').scrollTop=0};
$('backBtn').onclick=()=>{if(S.step>0){S.step--;render();$('leftBody').scrollTop=0}};

function syncIntentGoals(force){
  if(S.goals.length&&!force)return;
  const map={0:['Retirement',25,1,false],1:['Lump sum',5,1,false],2:['Existing portfolio',10,1,false]};
  if(force||!S.goals.length){S.goals=[];S.a.S1.forEach(i=>{const m=map[i];S.goals.push({id:gid++,name:m[0],years:m[1],flex:m[2],income:m[3]})})}
}
function applyConnect(i){
  const fill=(c,v)=>{if(S.a[c]===undefined){S.a[c]=v;S.pre[c]=true}};
  ['K2','K4','K5','T3','E1'].forEach(c=>{if(S.pre[c]){delete S.a[c];delete S.pre[c]}});
  if(i===0){fill('K2',3);fill('K4',3);fill('K5',1)}
  if(i===1){fill('K5',1);fill('T3',3);fill('E1',2)}
}
function loadPersona(k){
  fresh();
  if(k!=='reset'){const p=PERSONAS[k];S.a={...p.a,S1:[...p.a.S1]};p.pre.forEach(c=>S.pre[c]=true);
    S.goals=p.goals.map(g=>({id:gid++,name:g[0],years:g[1],flex:g[2],income:g[3]}));S.step=6;}
  render();$('leftBody').scrollTop=0;$('right').scrollTop=0;
}
render();
</script>
</body>
</html>
